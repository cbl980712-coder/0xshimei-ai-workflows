<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>合约仓位计算器</title>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --text:#14161c; --muted:#6b7280; --line:#e5e7ee;
  --input:#f7f8fb; --accent:#3b6cf6; --accent-weak:rgba(59,108,246,.12);
  --up:#0f9d6b; --up-weak:rgba(15,157,107,.12); --down:#e0384d; --down-weak:rgba(224,56,77,.12);
  --warn:#c77700; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --card:#171a21; --text:#e8eaf0; --muted:#8b93a5; --line:#262a35;
    --input:#1e222b; --accent:#6b8eff; --accent-weak:rgba(107,142,255,.16);
    --up:#2bc48a; --up-weak:rgba(43,196,138,.14); --down:#ff5c70; --down-weak:rgba(255,92,112,.14);
    --warn:#f0a83a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --card:#171a21; --text:#e8eaf0; --muted:#8b93a5; --line:#262a35;
  --input:#1e222b; --accent:#6b8eff; --accent-weak:rgba(107,142,255,.16);
  --up:#2bc48a; --up-weak:rgba(43,196,138,.14); --down:#ff5c70; --down-weak:rgba(255,92,112,.14);
  --warn:#f0a83a; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Microsoft YaHei","Apple SD Gothic Neo",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center}
select,.icon-btn{
  height:34px;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:9px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;
}
.icon-btn{width:34px;padding:0;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;text-transform:none;letter-spacing:.3px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inbox{
  display:flex;align-items:center;background:var(--input);border:1px solid var(--line);
  border-radius:10px;padding:0 12px;height:46px;transition:border-color .15s,box-shadow .15s;
}
.inbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.inbox.bad{border-color:var(--down)}
.inbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;font-weight:600;outline:none;height:100%}
.inbox .unit{color:var(--muted);font-size:13px;margin-left:8px}
.err{color:var(--down);font-size:12px;margin-top:5px;min-height:0}
.err:empty{display:none}
.side{display:grid;grid-template-columns:1fr 1fr;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.side button{height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.side button.on.long{background:var(--up);color:#fff}
.side button.on.short{background:var(--down);color:#fff}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted);margin-top:1px}
.stat.liq .v{color:var(--warn)}
/* price axis */
.axis{position:relative;height:118px;margin:6px 8px 4px}
.track{position:absolute;left:0;right:0;top:56px;height:6px;border-radius:3px;background:var(--line)}
.zone{position:absolute;top:56px;height:6px}
.zone.danger{background:linear-gradient(90deg,var(--down),var(--warn))}
.zone.danger.rev{background:linear-gradient(90deg,var(--warn),var(--down))}
.zone.safe{background:var(--up);opacity:.55}
.tick{position:absolute;top:50px;width:2px;height:18px;margin-left:-1px;background:var(--muted);opacity:.45;border-radius:1px}
.tick-l{position:absolute;top:72px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.mk{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pin{position:absolute;top:52px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px currentColor;background:currentColor}
.stem{position:absolute;width:2px;margin-left:-1px;background:currentColor}
.mk .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:currentColor}
.mk .tag span{color:#fff}
.c-entry{color:var(--accent)} .c-liq{color:var(--warn)}
.axis-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.axis-legend b{color:var(--text)}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl td.mv{color:var(--muted);font-weight:500}
.tbl .p{display:block;font-size:11px;color:var(--muted);font-weight:400}
.pos{color:var(--up)} .neg{color:var(--down)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--down-weak);color:var(--down);font-weight:600}
.sect{margin-bottom:16px}
.foot{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.empty{color:var(--muted);font-size:14px;padding:26px 0;text-align:center}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .wrap{padding:14px 16px 32px}
  .card{padding:14px}
  .stat .v{font-size:17px}
  .tbl th,.tbl td{padding-left:3px;padding-right:3px}
  .tbl td{font-size:14px}
  .axis{margin:6px 4px 4px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i="title">合约仓位计算器</h1>
      <div class="sub" data-i="subtitle">逐仓 · USDT 本位 · 实时计算</div>
    </div>
    <div class="tools">
      <select id="lang" aria-label="Language">
        <option value="zh">简体中文</option>
        <option value="zht">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
      <button class="icon-btn" id="theme" aria-label="Theme" title="">◐</button>
    </div>
  </header>

  <div class="grid">
    <section class="card">
      <h2 data-i="params">开仓参数</h2>
      <div class="field">
        <label data-i="direction">方向</label>
        <div class="side" role="group">
          <button type="button" id="bLong" class="long on" data-i="long">做多</button>
          <button type="button" id="bShort" class="short" data-i="short">做空</button>
        </div>
      </div>
      <div class="field">
        <label for="margin" data-i="margin">本金（保证金）</label>
        <div class="inbox" id="mBox"><input id="margin" class="num" inputmode="decimal" autocomplete="off" value="100"><span class="unit">USDT</span></div>
        <div class="err" id="mErr"></div>
      </div>
      <div class="field">
        <label for="lev" data-i="leverage">杠杆倍数</label>
        <div class="inbox" id="lBox"><input id="lev" class="num" inputmode="decimal" autocomplete="off" value="10"><span class="unit">×</span></div>
        <input type="range" id="levR" min="1" max="125" step="1" value="10" aria-label="leverage">
        <div class="chips" id="chips"></div>
        <div class="err" id="lErr"></div>
      </div>
      <div class="field" style="margin-bottom:4px">
        <label for="entry" data-i="entry">开仓价</label>
        <div class="inbox" id="eBox"><input id="entry" class="num" inputmode="decimal" autocomplete="off" value="65000"><span class="unit">USDT</span></div>
        <div class="err" id="eErr"></div>
      </div>
      <p class="note" data-i="mmrNote">维持保证金率按 0.5% 估算，未计手续费和资金费率。</p>
    </section>

    <section>
      <div class="stats">
        <div class="stat"><div class="k" data-i="posValue">仓位价值</div><div class="v num" id="oVal">–</div><div class="s num" id="oValS"></div></div>
        <div class="stat"><div class="k" data-i="qty">持仓数量</div><div class="v num" id="oQty">–</div><div class="s" data-i="qtyUnit">个币</div></div>
        <div class="stat liq"><div class="k" data-i="liqPrice">强平价</div><div class="v num" id="oLiq">–</div><div class="s num" id="oLiqS"></div></div>
        <div class="stat"><div class="k" data-i="distance">距强平</div><div class="v num" id="oDist">–</div><div class="s" data-i="distNote">价格反向波动</div></div>
      </div>

      <div class="card sect">
        <h2 data-i="axisTitle">价格轴</h2>
        <div id="axisWrap"></div>
      </div>

      <div class="card">
        <h2 data-i="pnlTitle">价格涨跌时的盈亏</h2>
        <div id="tblWrap"></div>
      </div>
      <p class="foot" data-i="disclaimer">本工具结果为估算，实际强平价以交易所为准（不同交易所的维持保证金率分档、手续费和标记价格计算方式不同）。合约交易风险较高，请控制仓位。</p>
    </section>
  </div>
</div>

var LOCALE = {zh:"zh-CN",zht:"zh-TW",en:"en-US",ja:"ja-JP",ko:"ko-KR"};

var $ = function(id){return document.getElementById(id);};
var state = {side:"long", lang:"zh"};

function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}

function detectLang(){
  var saved = store("pc_lang"); if(saved && I18N[saved]) return saved;
  var n = (navigator.language||"zh").toLowerCase();
  if(n.indexOf("zh")===0) return /tw|hk|mo|hant/.test(n) ? "zht" : "zh";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("ko")===0) return "ko";
  return "en";
}
function t(k){
  var s = (I18N[state.lang]||I18N.zh)[k] || I18N.zh[k] || k;
  for(var i=1;i<arguments.length;i++) s = s.split("{"+(i-1)+"}").join(arguments[i]);
  return s;
}
function applyLang(){
  document.documentElement.lang = LOCALE[state.lang];
  document.title = t("title");
  var els = document.querySelectorAll("[data-i]");
  for(var i=0;i<els.length;i++) els[i].textContent = t(els[i].getAttribute("data-i"));
  $("theme").title = t("themeTip"); $("theme").setAttribute("aria-label", t("themeTip"));
  $("lang").value = state.lang;
}

// number formatting
function decimalsFor(p){
  var a = Math.abs(p);
  if(a>=1000) return 2; if(a>=1) return 4; if(a>=0.01) return 6; return 8;
}
function fmt(n, d){
  return n.toLocaleString(LOCALE[state.lang], {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtPrice(p){ return fmt(p, decimalsFor(p)); }
function fmtUsd(n){ return fmt(n, 2); }
function fmtQty(q){
  var d = q>=1000?2:q>=1?4:q>=0.001?6:8;
  return fmt(q,d);
}
function fmtPct(x, sign){
  var s = fmt(x*100, Math.abs(x*100)>=1000?0:2) + "%";
  return (sign && x>0 ? "+" : "") + s;
}

function parseNum(raw){
  var s = String(raw).replace(/[,\s，_]/g,"").replace(/[。．]/g,".");
  if(s==="") return {empty:true};
  if(!/^\d*\.?\d+$|^\d+\.$/.test(s)) return {bad:true};
  return {v:parseFloat(s)};
}

function readField(inputId, boxId, errId, nameKey, example){
  var r = parseNum($(inputId).value), msg = "";
  if(r.empty) msg = t("eEmpty", t(nameKey));
  else if(r.bad) msg = t("eNum", t(nameKey), example);
  else if(!(r.v>0)) msg = t("ePos", t(nameKey));
  $(errId).textContent = msg;
  $(boxId).classList.toggle("bad", !!msg);
  return msg ? null : r.v;
}

function calc(M, L, P, side){
  var value = M*L, qty = value/P, liq;
  if(side==="long") liq = P*(1-1/L)/(1-MMR);
  else liq = P*(1+1/L)/(1+MMR);
  if(side==="long" && liq<=0) liq = null;
  var dist = liq===null ? null : Math.abs(liq-P)/P;
  var rows = MOVES.map(function(m){
    var price = P*(1+m);
    var pnl = (side==="long"?1:-1)*qty*(price-P);
    var liquidated = liq!==null && (side==="long" ? price<=liq : price>=liq);
    if(liquidated) pnl = -M;
    return {m:m, price:price, pnl:pnl, roe:pnl/M, liq:liquidated};
  });
  return {value:value, qty:qty, liq:liq, dist:dist, rows:rows};
}

function render(){
  var M = readField("margin","mBox","mErr","margin","100");
  var L = readField("lev","lBox","lErr","leverage","10");
  var P = readField("entry","eBox","eErr","entry","65000");
  if(L!==null && (L<1 || L>125)){ $("lErr").textContent = t("eLev"); $("lBox").classList.add("bad"); L = null; }
  syncLevUI(L);
  if(M===null || L===null || P===null){
    ["oVal","oQty","oLiq","oDist"].forEach(function(id){$(id).textContent="–";});
    $("oValS").textContent=""; $("oLiqS").textContent="";
    $("axisWrap").innerHTML = '<div class="empty">'+esc(t("fill"))+'</div>';
    $("tblWrap").innerHTML = '<div class="empty">'+esc(t("fill"))+'</div>';
    return;
  }
  var r = calc(M, L, P, state.side);
  $("oVal").textContent = fmtUsd(r.value);
  $("oValS").textContent = "USDT · " + t("lev", fmt(L, L%1?2:0));
  $("oQty").textContent = fmtQty(r.qty);
  if(r.liq===null){
    $("oLiq").textContent = t("noLiq"); $("oLiqS").textContent = t("noLiqNote"); $("oDist").textContent = "—";
  }else{
    $("oLiq").textContent = fmtPrice(r.liq);
    $("oLiqS").textContent = t("fromEntry", fmtPct((r.liq-P)/P, true));
    $("oDist").textContent = fmtPct(r.dist);
  }
  renderAxis(P, r.liq);
  renderTable(r.rows);
}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function renderAxis(P, liq){
  var lo = P*0.88, hi = P*1.12;
  if(liq!==null){ lo = Math.min(lo, liq); hi = Math.max(hi, liq); }
  else lo = 0;
  var pad = (hi-lo)*0.06; lo = Math.max(0, lo-pad); hi = hi+pad;
  var pos = function(p){ return ((p-lo)/(hi-lo))*100; };
  var h = '<div class="axis">';
  h += '<div class="track"></div>';
  if(liq!==null){
    var a = pos(Math.min(P,liq)), b = pos(Math.max(P,liq));
    h += '<div class="zone danger'+(state.side==="short"?" rev":"")+'" style="left:'+a+'%;width:'+(b-a)+'%"></div>';
  }
  // ±10% ticks
  [-0.10,-0.05,0.05,0.10].forEach(function(m){
    var x = pos(P*(1+m));
    h += '<div class="tick" style="left:'+x+'%"></div>';
    h += '<div class="tick-l num" style="left:'+x+'%">'+(m>0?"+":"")+Math.round(m*100)+'%</div>';
  });
  var ex = pos(P);
  h += '<div class="stem c-entry" style="left:'+ex+'%;top:22px;height:32px"></div>';
  h += '<div class="mk c-entry" style="left:'+clampLabel(ex)+'%;top:0"><div class="tag"><span>'+esc(t("entryTag"))+' '+esc(fmtPrice(P))+'</span></div></div>';
  h += '<div class="pin c-entry" style="left:'+ex+'%"></div>';
  if(liq!==null){
    var lx = pos(liq);
    h += '<div class="stem c-liq" style="left:'+lx+'%;top:66px;height:28px"></div>';
    h += '<div class="mk c-liq" style="left:'+clampLabel(lx)+'%;top:94px"><div class="tag"><span>'+esc(t("liqTag"))+' '+esc(fmtPrice(liq))+'</span></div></div>';
    h += '<div class="pin c-liq" style="left:'+lx+'%"></div>';
  }
  h += '</div>';
  h += '<div class="axis-legend num"><span>'+esc(fmtPrice(lo))+'</span>';
  if(liq!==null) h += '<span>'+esc(t("dangerZone"))+' <b>'+esc(fmtPct(Math.abs(liq-P)/P))+'</b></span>';
  else h += '<span>'+esc(t("noLiqNote"))+'</span>';
  h += '<span>'+esc(fmtPrice(hi))+'</span></div>';
  $("axisWrap").innerHTML = h;
}
// keep labels from overflowing card edges
function clampLabel(x){ var w = $("axisWrap").clientWidth || 300; var m = Math.min(45, 6000/w); return Math.max(m, Math.min(100-m, x)); }

function renderTable(rows){
  var h = '<table class="tbl"><thead><tr><th>'+esc(t("move"))+'</th><th>'+esc(t("price"))+'</th><th>'+esc(t("pnl"))+' (USDT)</th><th>'+esc(t("roe"))+'</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var cls = r.pnl>0 ? "pos" : r.pnl<0 ? "neg" : "";
    h += '<tr><td class="mv num">'+(r.m>0?"▲ +":"▼ ")+fmt(r.m*100,0)+'%</td>';
    h += '<td class="num">'+esc(fmtPrice(r.price))+'</td>';
    h += '<td class="num '+cls+'">'+(r.pnl>0?"+":"")+esc(fmtUsd(r.pnl))+'</td>';
    h += '<td class="num '+cls+'">'+(r.liq ? '<span class="badge">'+esc(t("liquidated"))+'</span>' : esc(fmtPct(r.roe, true)))+'</td></tr>';
  });
  h += '</tbody></table>';
  $("tblWrap").innerHTML = h;
}

function syncLevUI(L){
  if(L!==null && document.activeElement!==$("levR")) $("levR").value = Math.round(L);
  var chips = $("chips").children;
  for(var i=0;i<chips.length;i++) chips[i].classList.toggle("on", L!==null && +chips[i].dataset.v===L);
}

// init
PRESETS.forEach(function(v){
  var b = document.createElement("button"); b.type="button"; b.className="chip num"; b.dataset.v=v; b.textContent=v+"×";
  b.addEventListener("click", function(){ $("lev").value=v; $("levR").value=v; render(); });
  $("chips").appendChild(b);
});
$("levR").addEventListener("input", function(){ $("lev").value = this.value; render(); });
["margin","lev","entry"].forEach(function(id){ $(id).addEventListener("input", render); });
function setSide(s){
  state.side = s;
  $("bLong").classList.toggle("on", s==="long"); $("bShort").classList.toggle("on", s==="short");
  $("bLong").setAttribute("aria-pressed", s==="long"); $("bShort").setAttribute("aria-pressed", s==="short");
  render();
}
$("bLong").addEventListener("click", function(){setSide("long");});
$("bShort").addEventListener("click", function(){setSide("short");});
$("lang").addEventListener("change", function(){ state.lang=this.value; store("pc_lang", state.lang); applyLang(); render(); });
$("theme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  if(!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next); store("pc_theme", next);
});
var th = store("pc_theme"); if(th==="dark"||th==="light") document.documentElement.setAttribute("data-theme", th);
window.addEventListener("resize", render);

state.lang = detectLang();
applyLang();
setSide("long");
window.__calc = calc;
})();
</script>
