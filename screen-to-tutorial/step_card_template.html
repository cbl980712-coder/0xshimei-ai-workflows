<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#2563eb; --mark:#ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#131c2e; --ink:#e5e7eb; --muted:#94a3b8; --line:#243049; --accent:#60a5fa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:32px 16px 64px; }
  header h1 { font-size:clamp(24px,4vw,34px); margin:0 0 6px; line-height:1.3; }
  header p { margin:0; color:var(--muted); }
  .meta { display:inline-block; margin-top:12px; padding:2px 12px; border-radius:99px;
    background:var(--accent); color:#fff; font-size:13px; }
  .toc { margin:24px 0; padding:16px 20px 16px 40px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; }
  .toc b { display:block; margin:0 0 6px -20px; color:var(--muted); font-size:13px; letter-spacing:.04em; }
  .toc li { margin:2px 0; } .toc a { color:var(--accent); text-decoration:none; }
  .start { margin:0 0 20px; } .start img { width:100%; border-radius:12px; border:1px solid var(--line); display:block; }
  .start figcaption { color:var(--muted); font-size:13px; margin-top:4px; }
  .card { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:22px; align-items:start;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:0 0 20px;
    box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .shot { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); cursor:zoom-in;
    line-height:0; }
  .shot img { width:100%; height:auto; display:block; }
  .box { position:absolute; border:3px solid var(--mark); border-radius:6px;
    box-shadow:0 0 0 2px rgba(255,255,255,.6); pointer-events:none; }
  .dot { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    border:3px solid var(--mark); background:rgba(239,68,68,.25); pointer-events:none; }
  .badge { display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-weight:700; font-size:14px; }
  .badge i { font-style:normal; display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:15px; }
  .badge time { color:var(--muted); font-weight:400; font-size:12px; }
  .card h2 { margin:8px 0 8px; font-size:20px; line-height:1.4; }
  .card p { margin:0 0 8px; color:var(--ink); } .card .tip { color:var(--muted); font-size:14px;
    border-left:3px solid var(--accent); padding-left:10px; }
  footer { color:var(--muted); font-size:13px; text-align:center; margin-top:30px; }
  .zoom { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; place-items:center; z-index:9; cursor:zoom-out; }
  .zoom.on { display:grid; } .zoom img { max-width:96vw; max-height:94vh; border-radius:8px; }
  @media (max-width:720px) { .card { grid-template-columns:1fr; } }
  @media print { body { background:#fff; } .card { break-inside:avoid; box-shadow:none; } .zoom { display:none!important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
    <span class="meta">{{TOTAL}}</span>
  </header>
  <nav class="toc"><b>{{OVERVIEW}}</b><ol>
{{TOC}}
  </ol></nav>
  {{START}}
<!--CARD_START-->
  <section class="card" id="s{{N}}">
    <div class="shot">
      <img src="{{IMG}}" alt="{{STEP_LABEL}} {{N}}" loading="lazy">
      {{OVERLAY}}
    </div>
    <div class="text">
      <div class="badge"><i>{{N}}</i> {{STEP_LABEL}} {{N}} <time>{{TIME}}</time></div>
      <h2>{{CARD_TITLE}}</h2>
      {{CARD_DESC}}
    </div>
  </section>
<!--CARD_END-->
  <footer>{{FOOTER}}</footer>
</div>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
  (function () {
    var z = document.getElementById('zoom'), zi = z.querySelector('img');
    document.querySelectorAll('.shot, .start img').forEach(function (el) {
      el.addEventListener('click', function () {
        var im = el.tagName === 'IMG' ? el : el.querySelector('img');
        zi.src = im.src; z.classList.add('on');
      });
    });
    z.addEventListener('click', function () { z.classList.remove('on'); });
  })();
</script>
</body>
</html>
